[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myai-mcp"
version = "0.1.2"
description = "MCP server for the MyAi decentralized AI inference network"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MyAi", email = "jason@infinihash.com" }]
keywords = ["mcp", "ai", "inference", "decentralized", "myai", "depin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://myaitoken.io"
Documentation = "https://myaitoken.io/docs"
Repository = "https://github.com/myaitoken/myai-mcp"
"Agent Registry" = "https://myaitoken.io/agents"

[project.scripts]
myai-mcp = "myai_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/myai_mcp"]
